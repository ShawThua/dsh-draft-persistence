name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Host tests
        run: node test/host.test.mjs
      - name: Client tests
        run: node test/client.test.mjs
      - name: Syntax check
        run: node --check index.js && node --check client.js
